<!-- @dsCard group="Colors" viewport="700x170" name="Semantic — Status" subtitle="Approved / pending / rejected / info" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .col{display:flex;flex-direction:column;gap:6px}
  .chip{height:48px;border-radius:var(--radius-md)}
  .soft{height:26px;border-radius:var(--radius-sm)}
  .name{font-size:12px;font-weight:600;color:var(--text-heading)}
  .meta{font-size:11px;color:var(--text-muted)}
</style></head>
<body>
<div class="grid">
  <div class="col"><div class="chip" style="background:var(--status-success)"></div><div class="soft" style="background:var(--status-success-soft)"></div><div class="name">Success</div><div class="meta">อนุมัติ · เข้างาน</div></div>
  <div class="col"><div class="chip" style="background:var(--status-warning)"></div><div class="soft" style="background:var(--status-warning-soft)"></div><div class="name">Warning</div><div class="meta">รออนุมัติ · ลา</div></div>
  <div class="col"><div class="chip" style="background:var(--status-danger)"></div><div class="soft" style="background:var(--status-danger-soft)"></div><div class="name">Danger</div><div class="meta">ปฏิเสธ · เกินกำหนด</div></div>
  <div class="col"><div class="chip" style="background:var(--status-info)"></div><div class="soft" style="background:var(--status-info-soft)"></div><div class="name">Info</div><div class="meta">ทั่วไป</div></div>
</div>
</body></html>
