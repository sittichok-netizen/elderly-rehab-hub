<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Ink ramp" subtitle="Cool-tinted greys for text & lines" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
  .ramp{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 8px}
  .sw span{font-size:10px;font-weight:600;font-family:var(--font-mono)}
</style></head>
<body>
<div class="ramp">
  <div class="sw" style="background:var(--ink-950)"><span style="color:#fff">950</span></div>
  <div class="sw" style="background:var(--ink-900)"><span style="color:#fff">900</span></div>
  <div class="sw" style="background:var(--ink-800)"><span style="color:#fff">800</span></div>
  <div class="sw" style="background:var(--ink-700)"><span style="color:#fff">700</span></div>
  <div class="sw" style="background:var(--ink-600)"><span style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--ink-500)"><span style="color:#fff">500</span></div>
  <div class="sw" style="background:var(--ink-400)"><span style="color:#fff">400</span></div>
  <div class="sw" style="background:var(--ink-300)"><span style="color:var(--ink-800)">300</span></div>
  <div class="sw" style="background:var(--ink-200)"><span style="color:var(--ink-800)">200</span></div>
  <div class="sw" style="background:var(--ink-100)"><span style="color:var(--ink-800)">100</span></div>
  <div class="sw" style="background:var(--ink-50)"><span style="color:var(--ink-800)">50</span></div>
</div>
</body></html>
