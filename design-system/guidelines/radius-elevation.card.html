<!-- @dsCard group="Spacing" viewport="700x150" name="Radius & Elevation" subtitle="Corner radii and soft shadow scale" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--surface-app);display:flex;gap:30px;flex-wrap:wrap}
  .set{display:flex;gap:14px;align-items:flex-end}
  .box{width:64px;height:54px;background:var(--surface-card);border:1px solid var(--border-default);display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
  .sh{width:64px;height:54px;background:var(--surface-card);border-radius:var(--radius-lg)}
  .v{font-family:var(--font-mono);font-size:10px;color:var(--text-subtle)}
  .grp{display:flex;flex-direction:column;gap:8px}
  .lbl{font-size:11px;font-weight:600;color:var(--text-muted);letter-spacing:.03em;text-transform:uppercase}
</style></head>
<body>
<div class="grp"><span class="lbl">Radius</span><div class="set">
  <div class="box" style="border-radius:var(--radius-sm)"><span class="v">sm·6</span></div>
  <div class="box" style="border-radius:var(--radius-md)"><span class="v">md·8</span></div>
  <div class="box" style="border-radius:var(--radius-lg)"><span class="v">lg·12</span></div>
  <div class="box" style="border-radius:var(--radius-xl)"><span class="v">xl·16</span></div>
  <div class="box" style="border-radius:var(--radius-pill)"><span class="v">pill</span></div>
</div></div>
<div class="grp"><span class="lbl">Elevation</span><div class="set">
  <div class="sh" style="box-shadow:var(--shadow-xs)"></div>
  <div class="sh" style="box-shadow:var(--shadow-sm)"></div>
  <div class="sh" style="box-shadow:var(--shadow-md)"></div>
  <div class="sh" style="box-shadow:var(--shadow-lg)"></div>
</div></div>
</body></html>
