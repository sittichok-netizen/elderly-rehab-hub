<!-- @dsCard group="Colors" viewport="700x150" name="Brand — Sensory Teal" subtitle="Primary brand ramp, OKLCH" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-card);font-family:var(--font-sans)}
  .ramp{display:flex;gap:0;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-subtle)}
  .sw{flex:1;height:84px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px 10px}
  .sw span{font-size:11px;font-weight:600;font-family:var(--font-mono)}
</style></head>
<body>
<div class="ramp">
  <div class="sw" style="background:var(--brand-50)"><span style="color:var(--brand-700)">50</span></div>
  <div class="sw" style="background:var(--brand-100)"><span style="color:var(--brand-700)">100</span></div>
  <div class="sw" style="background:var(--brand-300)"><span style="color:var(--brand-700)">300</span></div>
  <div class="sw" style="background:var(--brand-400)"><span style="color:#fff">400</span></div>
  <div class="sw" style="background:var(--brand-500)"><span style="color:#fff">500 ·brand</span></div>
  <div class="sw" style="background:var(--brand-600)"><span style="color:#fff">600</span></div>
  <div class="sw" style="background:var(--brand-700)"><span style="color:#fff">700</span></div>
</div>
</body></html>
