<!-- @dsCard group="Brand" viewport="700x180" name="Voice — tone in product" subtitle="Polite Thai, clear, action-first" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--surface-card);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .col{padding:14px 16px;border-radius:var(--radius-md);border:1px solid var(--border-subtle)}
  .yes{background:var(--green-50)}
  .no{background:var(--red-50)}
  .h{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;margin-bottom:8px}
  .yes .h{color:var(--green-600)} .no .h{color:var(--red-600)}
  .ex{font-size:14px;color:var(--text-heading);margin-bottom:4px}
  .ex + .ex{margin-top:6px}
</style></head>
<body>
<div class="grid">
  <div class="col yes"><div class="h">✓ Do</div>
    <div class="ex">“ส่งคำขอลาเรียบร้อยแล้ว”</div>
    <div class="ex">“อนุมัติคำขอ”</div>
    <div class="ex">“คุณมีวันลาคงเหลือ 8 วัน”</div>
  </div>
  <div class="col no"><div class="h">✗ Avoid</div>
    <div class="ex">“ดำเนินการธุรกรรมสำเร็จ”</div>
    <div class="ex">“ทำการอนุมัติรายการ”</div>
    <div class="ex">“ERROR: invalid request”</div>
  </div>
</div>
</body></html>
