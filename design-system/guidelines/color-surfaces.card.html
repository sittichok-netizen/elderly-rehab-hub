<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--surface-app);font-family:var(--font-sans)}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .s{height:78px;border-radius:var(--radius-md);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:10px;font-size:12px;font-weight:600;color:var(--text-body)}
</style></head>
<body>
<div class="grid">
  <div class="s" style="background:var(--surface-app)">App</div>
  <div class="s" style="background:var(--surface-card);box-shadow:var(--shadow-sm)">Card</div>
  <div class="s" style="background:var(--surface-sunken)">Sunken</div>
  <div class="s" style="background:var(--surface-inverse);color:var(--text-on-inverse);border:none">Inverse</div>
</div>
</body></html>
