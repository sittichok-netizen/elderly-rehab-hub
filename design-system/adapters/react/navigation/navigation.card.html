<!-- @dsCard group="Components" viewport="700x220" name="Navigation — Tabs" subtitle="Underline & pill tab bars with count chips" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { margin: 0; padding: 30px; background: var(--surface-app); }
  .wrap { display: flex; flex-direction: column; gap: 22px; }
  .lbl { font-size: var(--text-2xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 12px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../../_ds_bundle.js"></script>
<script type="text/babel">
const { Tabs } = window.HAHSensoryDS;
function Demo() {
  const [a, setA] = React.useState("mine");
  const [b, setB] = React.useState("m");
  return (
    <>
      <div>
        <div className="lbl">Underline (page sections)</div>
        <Tabs value={a} onChange={setA} items={[
          { value: "mine", label: "คำขอของฉัน" },
          { value: "team", label: "ทีม", count: 4 },
          { value: "history", label: "ประวัติ" },
        ]} />
      </div>
      <div>
        <div className="lbl">Pill (compact filters)</div>
        <Tabs variant="pill" value={b} onChange={setB} items={[
          { value: "m", label: "เดือน" },
          { value: "q", label: "ไตรมาส" },
          { value: "y", label: "ปี" },
        ]} />
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
