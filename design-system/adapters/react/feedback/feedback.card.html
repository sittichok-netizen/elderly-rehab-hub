<!-- @dsCard group="Components" viewport="700x360" name="Feedback & Navigation" subtitle="Alert, Tooltip, Tabs" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../../styles.css" />
<style>
  body { margin: 0; padding: 28px; background: var(--surface-app); }
  .wrap { display: flex; flex-direction: column; gap: 20px; max-width: 600px; }
  .lbl { font-size: var(--text-2xs); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-subtle); margin-bottom: 10px; }
  .group + .group { border-top: 1px solid var(--border-subtle); padding-top: 18px; }
  .alerts { display: flex; flex-direction: column; gap: 10px; }
  [data-lucide] { width: 16px; height: 16px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../../_ds_bundle.js"></script>
<script type="text/babel">
const { Alert, Tooltip, Tabs, IconButton } = window.HAHSensoryDS;
const I = (n) => <i data-lucide={n}></i>;

function Demo() {
  const [tab, setTab] = React.useState("mine");
  return (
    <>
      <div className="group">
        <div className="lbl">Alert</div>
        <div className="alerts">
          <Alert tone="success" title="ส่งคำขอลาแล้ว">หัวหน้างานของคุณจะได้รับการแจ้งเตือนเพื่ออนุมัติ</Alert>
          <Alert tone="warning">วันลาพักร้อนคงเหลือเพียง 2 วันในปีนี้</Alert>
          <Alert tone="danger" title="คำขอถูกปฏิเสธ">กรุณาติดต่อฝ่ายบุคคลสำหรับรายละเอียดเพิ่มเติม</Alert>
        </div>
      </div>
      <div className="group">
        <div className="lbl">Tabs &nbsp;·&nbsp; Tooltip</div>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between" }}>
          <Tabs value={tab} onChange={setTab} items={[
            { value: "mine", label: "คำขอของฉัน" },
            { value: "team", label: "ทีม", count: 4 },
            { value: "history", label: "ประวัติ" },
          ]} />
          <Tooltip label="ส่งออกเป็น Excel">
            <IconButton aria-label="ส่งออก" solid>{I("download")}</IconButton>
          </Tooltip>
        </div>
        <div style={{ marginTop: 18 }}>
          <Tabs variant="pill" defaultValue="m" items={[
            { value: "m", label: "เดือน" },
            { value: "q", label: "ไตรมาส" },
            { value: "y", label: "ปี" },
          ]} />
        </div>
      </div>
    </>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
setTimeout(() => window.lucide && window.lucide.createIcons(), 50);
</script>
</body>
</html>
