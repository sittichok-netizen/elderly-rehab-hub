<!-- ================================================================
     SNIPPET: Drawer (Side Panel)
     Source:  ui_kits/hr-demo/kit.css — ต้อง copy CSS ด้านล่าง หรือ link kit.css
     Classes: .drawer-scrim (overlay) + .drawer (panel)
              .open = visible state (toggle ด้วย JS)
     Parts:   .drawer-head (title + close btn)
              .drawer-body (scrollable content)
              .drawer-foot (action buttons)
     A11y:    drawer ต้องมี role="dialog" + aria-modal="true" + aria-labelledby
              focus trap: เมื่อเปิด focus ไปที่ element แรกใน drawer
              Escape key: ปิด drawer
              เมื่อปิด: return focus กลับ trigger element
     ================================================================ -->

<!-- Trigger button -->

        id="open-drawer-btn" aria-haspopup="dialog">

</button>

<!-- Scrim (overlay) -->
<div class="drawer-scrim" id="drawer-scrim" aria-hidden="true"></div>

<!-- Drawer panel -->

  <div class="drawer-foot">
    <button class="sensory-btn is-secondary is-md" type="button" id="cancel-drawer-btn">ปิด</button>

  </div>

<!-- Vanilla JS: open/close + focus trap + Escape -->
<script>
(function () {
  const openBtn   = document.getElementById('open-drawer-btn');
  const closeBtn  = document.getElementById('close-drawer-btn');
  const cancelBtn = document.getElementById('cancel-drawer-btn');
  const scrim     = document.getElementById('drawer-scrim');
  const drawer    = document.getElementById('employee-drawer');
  if (!drawer) return;

  const focusable = 'button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])';

  function openDrawer() {
    drawer.classList.add('open');
    scrim.classList.add('open');
    drawer.setAttribute('aria-hidden', 'false');
    scrim.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    const first = drawer.querySelectorAll(focusable)[0];
    if (first) first.focus();
  }

  function closeDrawer() {
    drawer.classList.remove('open');
    scrim.classList.remove('open');
    drawer.setAttribute('aria-hidden', 'true');
    scrim.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (openBtn) openBtn.focus();
  }

  openBtn?.addEventListener('click', openDrawer);
  closeBtn?.addEventListener('click', closeDrawer);
  cancelBtn?.addEventListener('click', closeDrawer);
  scrim?.addEventListener('click', closeDrawer);

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && drawer.classList.contains('open')) closeDrawer();
  });

  // Focus trap
  drawer.addEventListener('keydown', e => {
    if (e.key !== 'Tab') return;
    const els = Array.from(drawer.querySelectorAll(focusable));
    const first = els[0], last = els[els.length - 1];
    if (e.shiftKey && document.activeElement === first) {
      e.preventDefault(); last.focus();
    } else if (!e.shiftKey && document.activeElement === last) {
      e.preventDefault(); first.focus();
    }
  });
}());
</script>

<!-- ✓ DO: role="dialog" + aria-modal="true" + aria-labelledby ทุกครั้ง -->
<!-- ✓ DO: focus trap + Escape key + return focus เมื่อปิด -->
<!-- ✓ DO: document.body.style.overflow = 'hidden' เมื่อ drawer เปิด -->
<!-- ✗ DO NOT: ใช้ visibility:hidden แทน .open class — animation จะไม่ทำงาน -->
<!-- ✗ DO NOT: เปิด drawer หลายตัวพร้อมกัน -->
